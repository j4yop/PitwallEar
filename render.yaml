services:
  - type: web
    name: pitwallear
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      # Free tier = 512 MB RAM: real transformer weights cannot fit. Keep
      # models OFF in production - agents degrade to clearly-labelled keyword
      # fallbacks (fast, stable), while pace/timeline/correlation stay fully
      # live. Full-strength ML runs locally where RAM allows.
      - key: PITWALLEAR_ALLOW_DOWNLOAD
        value: "0"
      - key: PITWALLEAR_WARMUP
        value: "none"
    autoDeploy: true
