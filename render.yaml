services:
  - type: web
    name: pitwallear
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: HF_TOKEN
        sync: false
      - key: PITWALLEAR_ALLOW_DOWNLOAD
        value: "1"
      # Free tier has 512 MB RAM: eager model loading OOM-crash-loops the
      # container into permanent 503s. Models load lazily per request instead.
      - key: PITWALLEAR_WARMUP
        value: "none"
      # Int8-quantize Linear layers at load time so full models fit in RAM.
      - key: PITWALLEAR_QUANTIZE
        value: "1"
    autoDeploy: true
